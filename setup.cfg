[flake8]
max-line-length = 80
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist,
    .hypothesis

[isort]
profile = black
line_length = 80

[coverage:run]
branch = True
source = src

[coverage:report]
show_missing = True
skip_covered = False

[tool:pytest]
testpaths = tests